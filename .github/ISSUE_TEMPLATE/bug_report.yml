name: Bug report
description: A rule, a webhook, the Admin page or the installation doesn't work as described.
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through a private report instead, see SECURITY.md.
        Never paste `.env` or `.aio` values, workspace credentials, webhook keys, tokens or customer data here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which method was shown or hidden, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the rule (its JSON from the Admin) and the cart (customer group, address, items), ideally as you entered it in Test a cart.
      placeholder: |
        1. Create a rule with ...
        2. Check out with ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rules (which methods are hidden)
        - Payment webhook
        - Shipping webhook
        - Admin page or Test a cart
        - Installation or App Management
        - Other
    validations:
      required: true
  - type: dropdown
    id: commerce
    attributes:
      label: Commerce
      options:
        - Adobe Commerce as a Cloud Service (SaaS)
        - Adobe Commerce on cloud infrastructure (PaaS)
        - Adobe Commerce on-premises
        - Not relevant
  - type: input
    id: version
    attributes:
      label: Method Restrictions version or commit
      placeholder: v0.1.0 or 2be2493
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Output of `aio app logs`, browser console errors or a screenshot. Remove any secrets and shopper data first.
      render: text
